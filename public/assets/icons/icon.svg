<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131a29"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.4"/>

  <!-- Outer Hex Shield -->
  <polygon points="256,54 440,150 440,362 256,458 72,362 72,150" fill="none" stroke="url(#neonCyan)" stroke-width="14" filter="url(#glow)"/>

  <!-- Central 3D Cube / Campus Building Emblem -->
  <polygon points="256,120 380,186 256,252 132,186" fill="url(#neonCyan)"/>
  <polygon points="132,186 256,252 256,392 132,326" fill="#0369a1"/>
  <polygon points="380,186 256,252 256,392 380,326" fill="#0284c7"/>

  <!-- Vocational Tech Star (Gold Accent) -->
  <polygon points="256,160 270,200 312,204 280,230 290,270 256,248 222,270 232,230 200,204 242,200" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Graduation Cap / V5 Ribbon -->
  <text x="256" y="445" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">SMK SILBER</text>
  <rect x="216" y="270" width="80" height="28" rx="8" fill="#f59e0b"/>
  <text x="256" y="290" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#090d16" text-anchor="middle">V5</text>
</svg>
