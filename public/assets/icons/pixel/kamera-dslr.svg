<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 32x32 Pixel Art Kamera DSLR Studio (DKV) -->
  <rect width="32" height="32" fill="none" />

  <!-- Camera Body -->
  <rect x="5" y="10" width="22" height="15" fill="#1e293b" />
  <rect x="6" y="11" width="20" height="13" fill="#334155" />

  <!-- Pentaprism Viewfinder Hump & Flash -->
  <rect x="11" y="6" width="10" height="4" fill="#1e293b" />
  <rect x="12" y="7" width="8" height="3" fill="#475569" />
  <rect x="8" y="8" width="2" height="2" fill="#e2e8f0" /> <!-- Shutter Button -->
  <rect x="22" y="8" width="3" height="2" fill="#ef4444" /> <!-- Red Video Rec Button -->

  <!-- Lens Mount & Barrel -->
  <rect x="10" y="12" width="12" height="11" fill="#0f172a" />
  <rect x="11" y="13" width="10" height="9" fill="#1e293b" />

  <!-- Glass Lens Element (Chroma Reflection) -->
  <rect x="12" y="14" width="8" height="7" fill="#0284c7" />
  <rect x="13" y="15" width="6" height="5" fill="#38bdf8" />
  <rect x="14" y="16" width="2" height="2" fill="#ffffff" /> <!-- Glint reflection -->

  <!-- Green Screen Status Dot -->
  <rect x="23" y="12" width="2" height="2" fill="#22c55e" />
</svg>
