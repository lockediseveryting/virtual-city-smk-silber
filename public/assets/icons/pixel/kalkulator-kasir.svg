<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 32x32 Pixel Art Mesin Kasir / Kalkulator Bank Mini TEFA (AKL/BD) -->
  <rect width="32" height="32" fill="none" />

  <!-- Body Base -->
  <rect x="6" y="6" width="20" height="22" fill="#0f172a" />
  <rect x="7" y="7" width="18" height="20" fill="#334155" />

  <!-- LCD Screen -->
  <rect x="9" y="9" width="14" height="6" fill="#84cc16" />
  <rect x="10" y="10" width="12" height="4" fill="#a3e635" />
  <rect x="11" y="11" width="10" height="2" fill="#14532d" /> <!-- Display Numbers -->

  <!-- Keypad Grid (3x3 buttons) -->
  <!-- Row 1 -->
  <rect x="9" y="17" width="3" height="2" fill="#64748b" />
  <rect x="13" y="17" width="3" height="2" fill="#64748b" />
  <rect x="17" y="17" width="3" height="2" fill="#f59e0b" /> <!-- Function orange -->

  <!-- Row 2 -->
  <rect x="9" y="20" width="3" height="2" fill="#64748b" />
  <rect x="13" y="20" width="3" height="2" fill="#64748b" />
  <rect x="17" y="20" width="3" height="2" fill="#64748b" />

  <!-- Row 3 -->
  <rect x="9" y="23" width="3" height="2" fill="#64748b" />
  <rect x="13" y="23" width="3" height="2" fill="#22c55e" /> <!-- Enter green -->
  <rect x="17" y="23" width="3" height="2" fill="#22c55e" />

  <!-- Thermal Paper Receipt Spout -->
  <rect x="12" y="3" width="8" height="3" fill="#f8fafc" />
  <rect x="13" y="4" width="6" height="1" fill="#cbd5e1" />
</svg>
