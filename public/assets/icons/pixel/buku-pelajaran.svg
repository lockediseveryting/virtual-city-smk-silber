<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 32x32 Pixel Art Buku Pelajaran (Open Blue Book with Red Ribbon) -->
  <rect width="32" height="32" fill="none" />
  <!-- Outline -->
  <rect x="3" y="6" width="26" height="20" fill="#0f172a" />
  <!-- Blue Cover Background -->
  <rect x="4" y="7" width="24" height="18" fill="#1e3a8a" />
  <rect x="4" y="8" width="24" height="16" fill="#0284c7" />
  <!-- Pages Inside -->
  <rect x="6" y="9" width="9" height="14" fill="#f8fafc" />
  <rect x="17" y="9" width="9" height="14" fill="#f8fafc" />
  <!-- Spine Shadow -->
  <rect x="15" y="9" width="2" height="14" fill="#cbd5e1" />
  <!-- Page Text Lines (Pixel details) -->
  <rect x="7" y="11" width="7" height="1" fill="#94a3b8" />
  <rect x="7" y="13" width="6" height="1" fill="#94a3b8" />
  <rect x="7" y="15" width="7" height="1" fill="#94a3b8" />
  <rect x="7" y="17" width="5" height="1" fill="#94a3b8" />
  <rect x="7" y="19" width="7" height="1" fill="#94a3b8" />

  <rect x="18" y="11" width="7" height="1" fill="#94a3b8" />
  <rect x="18" y="13" width="7" height="1" fill="#94a3b8" />
  <rect x="18" y="15" width="5" height="1" fill="#94a3b8" />
  <rect x="18" y="17" width="7" height="1" fill="#94a3b8" />
  <rect x="18" y="19" width="6" height="1" fill="#94a3b8" />
  <!-- Red Bookmark Ribbon hanging out -->
  <rect x="15" y="7" width="2" height="18" fill="#ef4444" />
  <rect x="14" y="24" width="4" height="2" fill="#dc2626" />
</svg>
