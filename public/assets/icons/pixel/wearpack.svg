<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 32x32 Pixel Art Wearpack Praktik Bengkel SMK -->
  <rect width="32" height="32" fill="none" />

  <!-- Collar & Neck -->
  <rect x="13" y="4" width="6" height="3" fill="#1e3a8a" />
  <rect x="14" y="5" width="4" height="2" fill="#fed7aa" />

  <!-- Shoulders & Upper Body (Navy with High-Vis Orange Stripes) -->
  <rect x="8" y="7" width="16" height="11" fill="#1e3a8a" />
  <rect x="9" y="8" width="14" height="2" fill="#f97316" /> <!-- Safety Reflective Stripe -->
  <rect x="9" y="11" width="14" height="1" fill="#cbd5e1" /> <!-- Silver Reflective Band -->

  <!-- Chest Pocket / SMK Silber Logo Patch -->
  <rect x="10" y="13" width="3" height="3" fill="#0f172a" />
  <rect x="11" y="14" width="1" height="1" fill="#facc15" /> <!-- Gold SMK Emblem -->

  <!-- Zipper Line -->
  <rect x="15" y="7" width="2" height="12" fill="#0f172a" />
  <rect x="15" y="7" width="1" height="12" fill="#cbd5e1" />

  <!-- Sleeves -->
  <rect x="5" y="8" width="3" height="8" fill="#1e3a8a" />
  <rect x="5" y="9" width="3" height="1" fill="#f97316" />
  <rect x="24" y="8" width="3" height="8" fill="#1e3a8a" />
  <rect x="24" y="9" width="3" height="1" fill="#f97316" />

  <!-- Belt / Waist -->
  <rect x="10" y="18" width="12" height="2" fill="#0f172a" />
  <rect x="14" y="18" width="4" height="2" fill="#e2e8f0" /> <!-- Belt Buckle -->

  <!-- Trousers / Legs -->
  <rect x="10" y="20" width="5" height="10" fill="#1e3a8a" />
  <rect x="17" y="20" width="5" height="10" fill="#1e3a8a" />
  <!-- Knee Reflective Pads -->
  <rect x="10" y="24" width="5" height="2" fill="#f97316" />
  <rect x="17" y="24" width="5" height="2" fill="#f97316" />
</svg>
