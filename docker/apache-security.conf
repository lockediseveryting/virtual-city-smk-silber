# Pengerasan Apache untuk versi Docker.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 60
KeepAliveTimeout 5
LimitRequestFields 60
LimitRequestFieldSize 8190

# Tolak metode HTTP yang tidak dipakai aplikasi
<Location />
    <LimitExcept GET POST HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Location>

# Berkas sensitif tidak pernah disajikan, di mana pun letaknya
<FilesMatch "\.(sqlite|sqlite-wal|sqlite-shm|db|bak|sql|log|env|ini|sh|yml|yaml|lock|md|dist|old|orig|swp|tar|gz|tgz|zip)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg)">
    Require all denied
</DirectoryMatch>

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive" "expr=%{REQUEST_URI} =~ m#^/(api|admin|ws)#"
</IfModule>

# Pemindai & crawler agresif/AI scraper (lapisan tambahan; aplikasi juga memfilter di PHP & .htaccess)
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP_USER_AGENT} (katana|projectdiscovery|nuclei|httpx|gobuster|dirsearch|ffuf|sqlmap|nikto|wpscan|masscan|zgrab|hakrawler|gospider|crawlergo|crawl4ai|crawlee|feroxbuster|dirbuster|wfuzz|arachni|acunetix|netsparker|commix|xsstrike|dalfox|whatweb|jaeles|naabu|nmap|zmeu|python-requests|go-http-client|scrapy|GPTBot|CCBot|ClaudeBot|anthropic-ai|Bytespider|PerplexityBot|Amazonbot|meta-externalagent|DataForSeoBot|PetalBot|MJ12bot|AhrefsBot|SemrushBot) [NC]
    RewriteRule ^ - [F,L]
    RewriteCond %{HTTP_USER_AGENT} ^-?$
    RewriteRule ^ - [F,L]
</IfModule>

# ---- Anti-DDoS / anti-flood ----
# Slowloris: header harus selesai dalam 20 dtk (min. 500 B/dtk), body min. 500 B/dtk.
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# Batas worker supaya flood tidak menghabiskan RAM laptop/server kecil.
<IfModule mpm_prefork_module>
    StartServers          4
    MinSpareServers       4
    MaxSpareServers      12
    MaxRequestWorkers   150
    MaxConnectionsPerChild 2000
</IfModule>
