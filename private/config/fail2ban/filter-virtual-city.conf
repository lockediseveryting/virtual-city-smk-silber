# Fail2ban filter untuk Virtual City SMK Silber v5
# Membaca log: /var/www/private/logs/security.log
# Format: 2026-10-12T12:00:00+00:00 event=login_failed ip=1.2.3.4 user=budi reason="wrong_password"

[INCLUDES]
before = common.conf

[Definition]
_daemon = virtual_city

failregex = ^\S+ event=(?:login_failed|honeypot_trap|rate_limit_exceeded|csrf_rejected) ip=<HOST>

ignoreregex =

datepattern = {^LN-BEG}%%Y-%%m-%%d[T ]%%H:%%M:%%S%%z
