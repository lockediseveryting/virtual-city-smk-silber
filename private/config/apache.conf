# Apache config — Virtual City SMK Silber v5 taruh di /etc/apache2/sites-available/virtualcity.conf
<VirtualHost *:80>
    ServerName DOMAIN
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName DOMAIN
    DocumentRoot /var/www/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/DOMAIN/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory /var/www/public>
        Options -Indexes -Includes
        AllowOverride All
        Require all granted
        RewriteEngine On

        # front controller untuk semua non-file (rewrite ke index.php)
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]

        # blokir file sensitif
        <FilesMatch "\.(sqlite|sqlite-wal|sqlite-shm|bak|sql|log|env|ini|yml|yaml|zip|tgz|tar|dist|old|OLD)$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/private>
        Require all denied
    </Directory>

    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(self), geolocation=()"

    ErrorLog /var/log/apache2/vc_error.log
    CustomLog /var/log/apache2/vc_access.log combined
</VirtualHost>
