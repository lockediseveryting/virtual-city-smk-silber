# Nginx config — Virtual City SMK Silber v5
# Letakkan di /etc/nginx/sites-available/virtualcity lalu symlink ke sites-enabled.
# Ganti DOMAIN dengan domain sekolah.

server {
    listen 80;
    server_name DOMAIN;
    # redirect ke HTTPS nanti otomatis via certbot --redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === Web root HANYA public/ ===
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # === Blokir file sensitif / cadangan ===
    location ~* \.(sqlite|sqlite-wal|sqlite-shm|bak|sql|log|env|ini|yml|yaml|zip|tgz|tar|md|dist|OLD|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* /(^\.)|(^\.\.)|/\.git|/\.env|/\.htaccess {
        deny all;
    }
    location ~ ^/(private|backups|logs|config|user_permissions)/ {
        deny all;
    }
    autoindex off;

    # === Rate limit (kode zona ditetapkan di http{} block: see note) ===
    # Di /etc/nginx/nginx.conf, di dalam http{}:
    #   limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    #   limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=120r/m;
    #   limit_req_zone $binary_remote_addr zone=general_zone:10m rate=240r/m;
    #   limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

    location = /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        try_files /index.php =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;
        try_files /index.php =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        limit_req zone=general_zone burst=40 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
}
